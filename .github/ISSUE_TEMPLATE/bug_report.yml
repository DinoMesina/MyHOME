name: "🐛 Bug Report"
description: "File a bug report or defect with the MyHOME integration."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for reporting an issue!

        💡 **One-Click Diagnostic Bundle**:
        If you have the Lovelace **MyHOME Bus Monitor Card** (`<myhome-bus-card>`) on your dashboard, click the **"📋 Report Issue / Copy Trace"** button. It instantly bundles your Home Assistant version, integration version, active gateway hardware parameters, buffer telemetry, and recent bus trace directly into your clipboard!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong? What did you observe versus what did you expect?
    validations:
      required: true

  - type: dropdown
    id: gateway_model
    attributes:
      label: Gateway Model
      description: Select your BTicino / Legrand OpenWebNet gateway hardware model.
      options:
        - "F454 (Audio/Video Gateway)"
        - "F455 (Advanced Gateway)"
        - "MH200 (Scenario Programmer)"
        - "MH200N (Scenario Programmer)"
        - "MH202 (Scenario Programmer)"
        - "AM4890 (Basic Gateway)"
        - "MyHomeServer1 (MHS1)"
        - "Legrand 3578 USB/Serial (Serial Interface)"
        - "F452 / F453AV"
        - "Other / Custom OpenWebNet Server"
    validations:
      required: true

  - type: dropdown
    id: connection_type
    attributes:
      label: Connection Type
      description: How is Home Assistant communicating with your OpenWebNet gateway?
      options:
        - "Ethernet / IP (TCP port 20000, unencrypted OpenWebNet)"
        - "Ethernet / IP (TCP port 20000, HMAC-SHA2 / SHA1 authenticated)"
        - "USB / Serial (RS-232 / USB-to-serial adapter, e.g. Legrand 3578)"
        - "Virtual / TCP Tunnel"
        - "Other"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: Find this under Settings -> About (e.g. 2024.9.0).
      placeholder: "e.g. 2024.9.0"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: The version or commit of the MyHOME integration.
      placeholder: "e.g. 1.0.0-beta (v2-phase1-architecture)"
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open Home Assistant dashboard
        2. Toggle switch 'switch.living_room'
        3. Observe that light physically switches on, but state flips back to off after 3 seconds...
    validations:
      required: true

  - type: textarea
    id: diagnostic_payload
    attributes:
      label: Bus Monitor Diagnostic Payload / Bus Trace
      description: |
        Paste the bundle generated by clicking the **"Report Issue / Copy Trace"** button in `<myhome-bus-card>`.
        This contains gateway parameters, buffer telemetry, and recent OpenWebNet frames.
      render: markdown
      placeholder: "Paste clipboard contents here (starts with ### MyHOME Diagnostic Bundle)..."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Home Assistant Core Logs
      description: Relevant log entries from Settings -> System -> Logs (please sanitize any passwords or sensitive tokens).
      render: text
      placeholder: "Paste relevant log messages from custom_components.myhome here..."
    validations:
      required: false

  - type: checkboxes
    id: diagnostics_json_reminder
    attributes:
      label: Diagnostics JSON File Reminder
      description: Home Assistant allows downloading an anonymized diagnostics JSON file.
      options:
        - label: "I will attach (drag & drop) the Home Assistant Diagnostics JSON file (Settings -> Devices & Services -> MyHOME -> 3 dots -> Download Diagnostics) if this issue relates to device discovery or entity mapping."
          required: false
